name: server

on:
  push:
    branches: [main, develop]
    paths: ["server/**"]
  pull_request:
    branches: [main, develop]
    paths: ["server/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
